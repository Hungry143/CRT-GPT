name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Tests, Postgres Persistence & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crt_ci
          POSTGRES_PASSWORD: crt_ci_password
          POSTGRES_DB: crt_stage2a_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crt_ci -d crt_stage2a_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MARKET_FEED_ENABLED: "false"
      BACKFILL_ENABLED: "false"
      CRT_ENGINE_ENABLED: "false"
      SIGNALS_ENABLED: "false"
      MARKET_DATA_PROVIDER: "none"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run Stage 1 & Stage 2A test suite (zero-credential defaults)
        run: npm test

      - name: Run PostgreSQL migration & cross-process integration tests
        env:
          DATABASE_URL: "postgresql://crt_ci:crt_ci_password@127.0.0.1:5432/crt_stage2a_test"
          TEST_DATABASE_URL: "postgresql://crt_ci:crt_ci_password@127.0.0.1:5432/crt_stage2a_test"
        run: |
          npm run db:migrate
          npx --yes tsx --test tests/stage2a-hardening-integration.test.ts tests/stage2a-final-integration.test.ts

      - name: Verify ingestion worker stays disabled by default
        run: npm run worker:ingest

      - name: Production Next.js build
        run: npm run build
